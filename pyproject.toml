[project]
name = "filesift"
version = "0.1.0"
description = "FileSift: Portable on-device semantic file search powered by EmbeddingGemma 2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "pillow>=10.0.0",
    "pillow-avif-plugin>=1.4.0",
    "pillow-jxl-plugin>=1.3.0",
    "pillow-heif>=0.16.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "av>=12.0.0",
    "pydantic>=2.7.0",
    "pywebview>=5.0.0",
    "python-multipart>=0.0.9"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
